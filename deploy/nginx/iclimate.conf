# iClimate server block for Nginx with PHP-FPM (PHP 8.2 or newer).
# Copy to /etc/nginx/sites-available/iclimate, adjust the three marked lines, link it into sites-enabled, then: nginx -t && systemctl reload nginx
# Not tested on this project's Windows machine (which runs Apache); it is the standard Laravel layout.

server {
    listen 80;
    server_name iclimate.example.gov.ph;                    # <- your address
    root /var/www/iclimate_system/public;                   # <- always the public/ folder, never the project root
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 55m;                               # community feed and message attachments are up to 50 MB

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets carry a content hash in their name.
    location ^~ /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;         # <- your PHP-FPM socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # No other PHP file is run, and hidden files (.env, .git) are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
