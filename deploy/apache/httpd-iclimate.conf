# iClimate on Apache (Windows / XAMPP's Apache 2.4), replacing `php artisan serve`.
#
# A complete, stand-alone server configuration: it does not touch XAMPP's own httpd.conf, so XAMPP's Apache
# (port 80, PHP 8.0) and this one can both exist. PHP 8.2+ runs as FastCGI processes (php-cgi.exe), several at
# once, so one slow page no longer blocks every other visitor the way the single-process dev server does.
#
# Started for you by:  start-services.bat   with   ICLIMATE_WEB_SERVER=apache   in .env
# By hand:
#   C:\php85-cli\php-cgi.exe -b 127.0.0.1:9085        (and 9086, 9087, 9088)
#   C:\xampp\apache\bin\httpd.exe -f "<project>\deploy\apache\httpd-iclimate.conf"
#
# Paths and the port can be overridden on the command line:  -D... is not needed, use
#   httpd.exe -C "Define ICLIMATE_ROOT D:/sites/iclimate" -C "Define ICLIMATE_PORT 80" -f ...

<IfDefine !ICLIMATE_ROOT>
    Define ICLIMATE_ROOT "C:/xampp/htdocs/iclimate_system"
</IfDefine>
<IfDefine !ICLIMATE_APACHE>
    Define ICLIMATE_APACHE "C:/xampp/apache"
</IfDefine>
<IfDefine !ICLIMATE_PORT>
    Define ICLIMATE_PORT 8000
</IfDefine>
<IfDefine !ICLIMATE_BIND>
    # 127.0.0.1 = this computer only. Use 0.0.0.0 to serve the office network (then also set APP_URL in .env).
    Define ICLIMATE_BIND 127.0.0.1
</IfDefine>
# start-services.bat sets this from ICLIMATE_WEB_BIND in .env.

ServerRoot "${ICLIMATE_APACHE}"
Listen ${ICLIMATE_BIND}:${ICLIMATE_PORT}
ServerName localhost:${ICLIMATE_PORT}
ServerTokens Prod
Header always unset X-Powered-By
ServerSignature Off
TraceEnable Off
Timeout 120
KeepAlive On

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so

TypesConfig conf/mime.types
PidFile "${ICLIMATE_ROOT}/storage/logs/apache.pid"
# Both logs are rotated at 10 MB and the five newest files are kept, so they never fill the disk.
ErrorLog "|bin/rotatelogs.exe -n 5 \"${ICLIMATE_ROOT}/storage/logs/apache-error.log\" 10M"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b %D" iclimate
CustomLog "|bin/rotatelogs.exe -n 5 \"${ICLIMATE_ROOT}/storage/logs/apache-access.log\" 10M" iclimate

# Nothing outside public/ is ever served: .env, storage/, vendor/ and the source code are not reachable.
<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "${ICLIMATE_ROOT}/public"
<Directory "${ICLIMATE_ROOT}/public">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    # Laravel's front controller (the rules of public/.htaccess, kept here so .htaccess need not be read).
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</Directory>

# Hidden files (.env, .git, .htaccess) are refused even if one ends up under public/.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# PHP 8.2+ as FastCGI. Four processes = four pages at the same time.
ProxyFCGIBackendType GENERIC
# Through a balancer Apache hands PHP a script path it cannot open on Windows ("/C:/..."); say it plainly.
ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{reqenv:DOCUMENT_ROOT}%{reqenv:SCRIPT_NAME}"
<Proxy "balancer://iclimate-php/">
    BalancerMember "fcgi://127.0.0.1:9085" retry=1 timeout=120
    BalancerMember "fcgi://127.0.0.1:9086" retry=1 timeout=120
    BalancerMember "fcgi://127.0.0.1:9087" retry=1 timeout=120
    BalancerMember "fcgi://127.0.0.1:9088" retry=1 timeout=120
    ProxySet lbmethod=byrequests
</Proxy>
<FilesMatch "\.php$">
    SetHandler "proxy:balancer://iclimate-php/"
</FilesMatch>

# Built assets carry a content hash in their name, so browsers may keep them for a year.
<LocationMatch "^/build/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml text/plain
