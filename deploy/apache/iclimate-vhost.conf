# iClimate virtual host for Apache 2.4 on Linux with PHP-FPM (PHP 8.2 or newer).
# Needs: a2enmod rewrite headers proxy_fcgi setenvif deflate expires
# Copy to /etc/apache2/sites-available/iclimate.conf, adjust the three marked lines, then: a2ensite iclimate && systemctl reload apache2
# (Windows/XAMPP: use httpd-iclimate.conf in this folder instead; start-services.bat runs it for you.)

<VirtualHost *:80>
    ServerName iclimate.example.gov.ph                      # <- your address
    DocumentRoot /var/www/iclimate_system/public            # <- always the public/ folder, never the project root

    <Directory /var/www/iclimate_system/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"   # <- your PHP-FPM socket
    </FilesMatch>

    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    Header always unset X-Powered-By
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    ErrorLog ${APACHE_LOG_DIR}/iclimate-error.log
    CustomLog ${APACHE_LOG_DIR}/iclimate-access.log combined
</VirtualHost>
