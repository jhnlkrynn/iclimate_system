# Intended VPS configuration; validate on Ubuntu after provisioning and issuing the certificate.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name iclimate-lian.tech www.iclimate-lian.tech;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iclimate-lian.tech www.iclimate-lian.tech;
    root /var/www/iclimate_system/public;
    # Fail closed until the owner approves public launch.
    include snippets/iclimate-private.conf;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/iclimate-lian.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iclimate-lian.tech/privkey.pem;
    # TLS hardening (deployment audit 2026-11-19): TLS 1.2/1.3 only, no session tickets, modern ciphers by default.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:iClimateSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 20m;

    # One copy of each header per response: nginx adds these to every location without its own add_header (the PHP
    # location hides the application's duplicates with fastcgi_hide_header; the CSP is left to the application,
    # which owns its per-response nonce). Values match App\Http\Middleware\SecurityHeaders.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

    # Hashed Vite assets never change under the same name.
    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        # Drop the application's copies: the server-level add_header values above are sent instead (no duplicates).
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
        fastcgi_hide_header Strict-Transport-Security;
    }

    location ~ /\. { deny all; }
}

