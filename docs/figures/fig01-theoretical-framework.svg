<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. Theoretical Framework</title>
  <desc id="desc">Diagram for the iClimate web-based decision-support platform.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #1b1b1b; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #455a64; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #1b1b1b; }
      .box-line { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #263238; }
      .edge-label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #263238; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #455a64; }
      .phase { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #1b1b1b; }
    </style>
  </defs>
  <rect width="1600" height="800" fill="#ffffff"/>
  <text x="800.0" y="54" text-anchor="middle" class="title">Figure 1. Theoretical Framework</text>
  <line x1="440" y1="290" x2="570" y2="290" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="390" y="266" width="230" height="30" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
<text x="505" y="286" text-anchor="middle" class="edge-label">feeds</text>
<line x1="1030" y1="290" x2="1160" y2="290" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="980" y="266" width="230" height="30" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
<text x="1095" y="286" text-anchor="middle" class="edge-label">guides</text>
<line x1="1160" y1="403" x2="942" y2="540" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="936" y="447" width="230" height="30" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
<text x="1051" y="467" text-anchor="middle" class="edge-label">produces</text>
<line x1="440" y1="403" x2="657" y2="540" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="433" y="447" width="230" height="30" rx="8" fill="#ffffff" stroke="#cfd8dc"/>
<text x="548" y="467" text-anchor="middle" class="edge-label">supports</text>
  <rect x="80" y="155" width="360" height="270" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="260.0" y="189" text-anchor="middle" class="box-title">Climate and Farm Inputs</text>
<text x="260.0" y="223" text-anchor="middle" class="box-line">Rainfall, temperature,</text>
<text x="260.0" y="247" text-anchor="middle" class="box-line">humidity, wind speed</text>
<text x="260.0" y="276" text-anchor="middle" class="box-line">Barangay, season, farm</text>
<text x="260.0" y="300" text-anchor="middle" class="box-line">area, farm type</text>
<text x="260.0" y="329" text-anchor="middle" class="box-line">Rice production and</text>
<text x="260.0" y="353" text-anchor="middle" class="box-line">user requests</text>
<rect x="570" y="145" width="460" height="290" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
<text x="800.0" y="179" text-anchor="middle" class="box-title">Theoretical Basis</text>
<text x="800.0" y="213" text-anchor="middle" class="box-line">Decision Support System</text>
<text x="800.0" y="242" text-anchor="middle" class="box-line">Climate-smart agriculture</text>
<text x="800.0" y="271" text-anchor="middle" class="box-line">Predictive modeling</text>
<text x="800.0" y="300" text-anchor="middle" class="box-line">Web-based agricultural</text>
<text x="800.0" y="324" text-anchor="middle" class="box-line">information system</text>
<rect x="1160" y="155" width="360" height="270" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
<text x="1340.0" y="189" text-anchor="middle" class="box-title">iClimate Processes</text>
<text x="1340.0" y="223" text-anchor="middle" class="box-line">Weather analysis</text>
<text x="1340.0" y="252" text-anchor="middle" class="box-line">Rice yield prediction</text>
<text x="1340.0" y="281" text-anchor="middle" class="box-line">Advisory generation</text>
<text x="1340.0" y="310" text-anchor="middle" class="box-line">Risk mapping</text>
<text x="1340.0" y="339" text-anchor="middle" class="box-line">Reports and</text>
<text x="1340.0" y="363" text-anchor="middle" class="box-line">notifications</text>
<rect x="570" y="540" width="460" height="180" rx="12" fill="#fff8e1" stroke="#ef6c00" stroke-width="3"/>
<text x="800.0" y="574" text-anchor="middle" class="box-title">Decision-Support Outcome</text>
<text x="800.0" y="608" text-anchor="middle" class="box-line">Climate-informed rice</text>
<text x="800.0" y="632" text-anchor="middle" class="box-line">farming decisions</text>
<text x="800.0" y="661" text-anchor="middle" class="box-line">Farmer and MAO planning</text>
<text x="800.0" y="685" text-anchor="middle" class="box-line">support</text>
  
</svg>
