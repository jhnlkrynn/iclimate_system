<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2. Conceptual Framework</title>
  <desc id="desc">Diagram for the iClimate web-based decision-support platform.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #1b1b1b; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #455a64; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #1b1b1b; }
      .box-line { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #263238; }
      .edge-label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #263238; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #455a64; }
      .phase { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #1b1b1b; }
    </style>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="800.0" y="54" text-anchor="middle" class="title">Figure 2. Conceptual Framework</text>
  <line x1="390" y1="365" x2="470" y2="365" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="890" y1="365" x2="970" y2="365" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="970" y1="539" x2="859" y2="660" stroke="#37474f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="70" y="160" width="320" height="410" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
<text x="230.0" y="194" text-anchor="middle" class="box-title">Input</text>
<text x="230.0" y="228" text-anchor="middle" class="box-line">PAGASA climate</text>
<text x="230.0" y="252" text-anchor="middle" class="box-line">records</text>
<text x="230.0" y="281" text-anchor="middle" class="box-line">Open-Meteo forecasts</text>
<text x="230.0" y="310" text-anchor="middle" class="box-line">MAO rice records</text>
<text x="230.0" y="339" text-anchor="middle" class="box-line">Farm area and type</text>
<text x="230.0" y="368" text-anchor="middle" class="box-line">Barangay and season</text>
<text x="230.0" y="397" text-anchor="middle" class="box-line">User role/request</text>
<rect x="470" y="160" width="420" height="410" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
<text x="680.0" y="194" text-anchor="middle" class="box-title">Process</text>
<text x="680.0" y="228" text-anchor="middle" class="box-line">Collect and validate data</text>
<text x="680.0" y="257" text-anchor="middle" class="box-line">Store in MySQL</text>
<text x="680.0" y="286" text-anchor="middle" class="box-line">Analyze weather variables</text>
<text x="680.0" y="315" text-anchor="middle" class="box-line">Run prediction model</text>
<text x="680.0" y="344" text-anchor="middle" class="box-line">Generate advisories</text>
<text x="680.0" y="373" text-anchor="middle" class="box-line">Score agricultural risk</text>
<text x="680.0" y="402" text-anchor="middle" class="box-line">Prepare dashboards/reports</text>
<rect x="970" y="160" width="320" height="410" rx="12" fill="#fff8e1" stroke="#ef6c00" stroke-width="3"/>
<text x="1130.0" y="194" text-anchor="middle" class="box-title">Output</text>
<text x="1130.0" y="228" text-anchor="middle" class="box-line">Weather forecast</text>
<text x="1130.0" y="257" text-anchor="middle" class="box-line">Rice yield estimate</text>
<text x="1130.0" y="286" text-anchor="middle" class="box-line">Planting advisory</text>
<text x="1130.0" y="315" text-anchor="middle" class="box-line">Irrigation</text>
<text x="1130.0" y="339" text-anchor="middle" class="box-line">recommendation</text>
<text x="1130.0" y="368" text-anchor="middle" class="box-line">Risk heat map</text>
<text x="1130.0" y="397" text-anchor="middle" class="box-line">Reports and</text>
<text x="1130.0" y="421" text-anchor="middle" class="box-line">notifications</text>
<text x="1130.0" y="450" text-anchor="middle" class="box-line">AI response</text>
<rect x="480" y="660" width="640" height="130" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3"/>
<text x="800.0" y="694" text-anchor="middle" class="box-title">Outcome</text>
<text x="800.0" y="728" text-anchor="middle" class="box-line">Web-based climate-informed decision</text>
<text x="800.0" y="752" text-anchor="middle" class="box-line">support for rice farming in Lian,</text>
<text x="800.0" y="776" text-anchor="middle" class="box-line">Batangas</text>
  
</svg>
