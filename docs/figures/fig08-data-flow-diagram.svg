  <line x1="60" y1="1185" x2="1540" y2="1185" stroke="#cfd8dc" stroke-width="2"/>
  <text x="85" y="1170" class="legend-title">Numbered Data Flows</text>
  <text x="85" y="1208" class="edge-label">1 Login, registration, or role request</text>
<text x="85" y="1231" class="edge-label">2 Verified user account and role access</text>
<text x="85" y="1254" class="edge-label">3 Authorized session continues to record modules</text>
<text x="85" y="1277" class="edge-label">4 Farmer profile, climate record, or rice production entry</text>
<text x="85" y="1300" class="edge-label">5 Validated local records saved to database</text>
<text x="85" y="1323" class="edge-label">6 PAGASA advisory or historical-climate reference data</text>
<text x="85" y="1346" class="edge-label">7 Forecast variables: rainfall, temperature, humidity, wind</text>
<text x="820" y="1208" class="edge-label">8 Normalized weather data stored for later use</text>
<text x="820" y="1231" class="edge-label">9 Weather and farm records sent to prediction processing</text>
<text x="820" y="1254" class="edge-label">10 Model or AI response returned to iClimate</text>
<text x="820" y="1277" class="edge-label">11 Prediction result sent to decision-output generation</text>
<text x="820" y="1300" class="edge-label">12 Advisories, heat map, reports, and notifications saved</text>
<text x="820" y="1323" class="edge-label">13 Decision-support outputs displayed to users</text>
</svg>
